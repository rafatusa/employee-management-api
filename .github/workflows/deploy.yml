      with:
        gradle-version: 8.10.2
    - name: Build bootJar
      run: gradle --no-daemon bootJar -x test
    - id: meta
      name: Compute image tag
      run: 'echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

        '
    - name: Build image with Podman
      run: "podman build \\\n  --format docker \\\n  -t \"localhost/app:${GITHUB_SHA::12}\"\
        \ \\\n  -f Containerfile .\n"
    - name: Start local registry and push image for Clair indexing
      run: "podman run -d --name scan-registry --network host \\\n  docker.io/library/registry:2\n\
        for i in $(seq 1 30); do\n  if curl -sf http://localhost:5000/v2/ >/dev/null;\
        \ then\n    echo \"registry ready\"; break\n  fi\n  echo \"waiting for registry\
        \ ($i/30)\"; sleep 2\ndone\ncurl -sf http://localhost:5000/v2/ >/dev/null\n\
        podman tag \"localhost/app:${GITHUB_SHA::12}\" \\\n  \"localhost:5000/app:${GITHUB_SHA::12}\"\
        \npodman push --tls-verify=false \\\n  \"localhost:5000/app:${GITHUB_SHA::12}\"\
        \n"
    - name: Start Clair and its datastore
      run: bash scripts/clair-up.sh
    - name: Install clairctl
      run: bash scripts/install-clairctl.sh
    - name: Clair container vulnerability scan
      run: bash scripts/clair-scan.sh "localhost:5000/app:${GITHUB_SHA::12}"
    - name: Upload Clair report
      uses: actions/upload-artifact@v4
      with:
        name: clair-scan-report
        path: reports/clair
        if-no-files-found: warn
    - name: Log in to GHCR
      run: "printf '%s' \"$GHCR_TOKEN\" \\\n  | podman login ghcr.io -u \"${{ github.actor\
        \ }}\" --password-stdin\n"
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Push image to GHCR
      run: 'REPO_LC="$(echo "${{ github.repository }}" | tr ''[:upper:]'' ''[:lower:]'')"

        podman tag "localhost/app:${GITHUB_SHA::12}" "ghcr.io/${REPO_LC}:${GITHUB_SHA::12}"

        podman tag "localhost/app:${GITHUB_SHA::12}" "ghcr.io/${REPO_LC}:latest"

        podman push "ghcr.io/${REPO_LC}:${GITHUB_SHA::12}"

        podman push "ghcr.io/${REPO_LC}:latest"

        '
  provision:
    runs-on: ubuntu-latest
    needs:
    - image_build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
