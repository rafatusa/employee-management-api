        echo "Core infrastructure present in state"

        '
      working-directory: infra
    - name: Verify application through Nginx
      run: "HOST=\"$(terraform output -raw instance_public_ip)\"\ncurl --fail --silent\
        \ --show-error --retry 15 --retry-delay 10 \\\n  --retry-all-errors \"http://$HOST/actuator/health\"\
        \necho \"\"\ncurl --fail --silent --show-error \"http://$HOST/api/v1/employees\"\
        \ \\\n  -H \"Accept: application/json\" -u \"admin:$ADMIN_SECRET\" -o /dev/null\n\
        echo \"Authenticated API call succeeded\"\necho \"Application verified at\
        \ http://$HOST\"\n"
      working-directory: infra
      env:
        ADMIN_SECRET: ${{ secrets.API_ADMIN_PASSWORD }}
