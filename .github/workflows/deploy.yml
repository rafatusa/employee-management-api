    - name: Semgrep SAST
      run: semgrep scan --config p/java --config p/secrets --error --metrics=off src
  image_build_push:
    runs-on: ubuntu-latest
    needs:
    - semgrep
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      CLAIR_VERSION: 4.7.4
      CLAIRCTL_VERSION: 4.7.4
      CLAIR_CONFIG_DIR: /tmp/clair
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Gradle
