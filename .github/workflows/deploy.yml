        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform format check
      run: terraform fmt -check -recursive
      working-directory: infra
    - name: Terraform validate
      run: terraform validate -no-color
      working-directory: infra
    - name: Terraform plan
      run: terraform plan -input=false -no-color -out=tfplan
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -no-color -auto-approve tfplan
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    - image_build_push
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tf
      name: Read infrastructure outputs
      run: 'echo "host=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

        '
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ steps.tf.outputs.host }}
    - name: Wait for SSH availability
      run: "for i in $(seq 1 30); do\n  if ssh -i ~/.ssh/deploy_key -o BatchMode=yes\
        \ -o ConnectTimeout=10 \\\n    \"$SSH_USER@$HOST\" true 2>/dev/null; then\n\
        \    echo \"SSH ready\"; exit 0\n  fi\n  echo \"waiting for ssh ($i/30)\"\
        ; sleep 10\ndone\necho \"SSH never became available\"; exit 1\n"
      env:
        SSH_USER: ${{ secrets.SSH_USER }}
        HOST: ${{ steps.tf.outputs.host }}
    - name: Render Chef node attributes
      run: 'mkdir -p ../chef/nodes

        DB_HOST="$(terraform output -raw db_address)" \

        DB_PORT="$(terraform output -raw db_port)" \

        DB_NAME="$(terraform output -raw db_name)" \

        DB_USER="$(terraform output -raw db_username)" \

        REPO_LC="$(echo "$REPOSITORY" | tr ''[:upper:]'' ''[:lower:]'')" \

        python3 ../scripts/render-node-json.py > ../chef/nodes/app.json

        echo "Rendered node attributes ($(wc -c < ../chef/nodes/app.json) bytes)"

        '
      working-directory: infra
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
        API_ADMIN_USERNAME: admin
        REG_USER: ${{ github.actor }}
        REG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_TAG: ${{ needs.image_build_push.outputs.image_tag }}
        PROJECT: ${{ secrets.PROJECT_NAME }}
        REPOSITORY: ${{ github.repository }}
    - name: Upload Chef cookbook and run chef-solo
      run: "tar czf /tmp/chef-bundle.tgz -C chef .\nscp -i ~/.ssh/deploy_key -o BatchMode=yes\
        \ \\\n  /tmp/chef-bundle.tgz \"$SSH_USER@$HOST:/tmp/chef-bundle.tgz\"\nssh\
        \ -i ~/.ssh/deploy_key -o BatchMode=yes \"$SSH_USER@$HOST\" \\\n  'sudo bash\
        \ -s' < scripts/run-chef.sh\n"
      env:
        SSH_USER: ${{ secrets.SSH_USER }}
        HOST: ${{ steps.tf.outputs.host }}
    - name: Wait for application health through Nginx
      run: "curl --fail --silent --show-error --retry 20 --retry-delay 15 \\\n  --retry-all-errors\
        \ \"http://$HOST/actuator/health\"\necho \"\"\necho \"Application is healthy\
        \ at http://$HOST\"\n"
      env:
        HOST: ${{ steps.tf.outputs.host }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
