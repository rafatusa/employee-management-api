name: infrastructure
'on':
  workflow_dispatch: {}
jobs:
  terraform_lifecycle:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform format
      run: terraform fmt -check -recursive
      working-directory: infra
    - name: Terraform validate
      run: terraform validate -no-color
      working-directory: infra
    - name: Terraform plan
      run: terraform plan -input=false -no-color -out=tfplan
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -no-color -auto-approve tfplan
      working-directory: infra
    - name: Verify infrastructure
      run: 'terraform state list

        echo "application URL: $(terraform output -raw application_url)"

        terraform output -raw db_address > /dev/null

        echo "Infrastructure verified"

        '
      working-directory: infra
