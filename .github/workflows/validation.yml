# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: validation
'on':
  workflow_dispatch: {}
jobs:
  smoke_and_integration:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2
    - name: Set up Node for Newman
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tf
      name: Resolve target host
      run: echo "host=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Smoke test
      run: "curl --fail --silent --show-error --retry 10 --retry-delay 10 \\\n  --retry-all-errors\
        \ \"http://$HOST/actuator/health\"\necho \"\"\necho \"Smoke test passed\"\n"
      env:
        HOST: ${{ steps.tf.outputs.host }}
    - name: REST Assured integration tests
      run: gradle --no-daemon integrationTest
      env:
        TARGET_BASE_URL: http://${{ steps.tf.outputs.host }}
        API_ADMIN_USERNAME: admin
        API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
    - name: Install Newman
      run: npm install --no-save newman newman-reporter-htmlextra
    - name: Newman functional tests
      run: "mkdir -p reports/newman\nnpx newman run tests/postman/employee-api.postman_collection.json\
        \ \\\n  --env-var \"base_url=$BASE_URL\" \\\n  --env-var \"admin_user=admin\"\
        \ \\\n  --env-var \"admin_password=$ADMIN_SECRET\" \\\n  --reporters cli,htmlextra\
        \ \\\n  --reporter-htmlextra-export reports/newman/report.html\n"
      env:
        BASE_URL: http://${{ steps.tf.outputs.host }}
        ADMIN_SECRET: ${{ secrets.API_ADMIN_PASSWORD }}
    - name: Install k6
      run: "curl -sL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz\
        \ \\\n  -o /tmp/k6.tgz\ntar xzf /tmp/k6.tgz -C /tmp\nsudo mv /tmp/k6-v0.55.0-linux-amd64/k6\
        \ /usr/local/bin/k6\nk6 version\n"
    - name: k6 load test with p95 and error-rate thresholds
      run: 'mkdir -p reports/k6

        k6 run --summary-export reports/k6/summary.json tests/k6/load-test.js

        '
      env:
        BASE_URL: http://${{ steps.tf.outputs.host }}
        API_ADMIN_USERNAME: admin
        API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
    - name: Copy REST Assured HTML results into the report tree
      run: "mkdir -p reports/integrationTest\ncp -r build/reports/tests/integrationTest/.\
        \ reports/integrationTest/ 2>/dev/null || \\\n  echo \"No REST Assured HTML\
        \ report produced\"\n"
    - name: Generate consolidated HTML report
      run: bash scripts/generate-report.sh
    - name: Publish test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-reports
        path: reports
        if-no-files-found: warn
