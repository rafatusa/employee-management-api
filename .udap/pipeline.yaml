version: 1
name: employee-management-api
vcs: github
rollback:
  strategy: rerun

stages:
  - id: gradle_build
    kind: build
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile
        run: gradle --no-daemon clean compileJava compileTestJava

  - id: checkstyle
    kind: lint
    needs: [gradle_build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Checkstyle
        run: gradle --no-daemon checkstyleMain checkstyleTest

  - id: pmd
    kind: lint
    needs: [gradle_build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: PMD
        run: gradle --no-daemon pmdMain

  - id: spotbugs
    kind: lint
    needs: [gradle_build]
    timeout_minutes: 15
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: SpotBugs
        run: gradle --no-daemon spotbugsMain

  - id: unit_tests
    kind: test
    needs: [checkstyle, pmd, spotbugs]
    timeout_minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: JUnit 5 tests
        run: gradle --no-daemon test
      - name: JaCoCo report and 90 percent coverage gate
        run: gradle --no-daemon jacocoTestReport jacocoTestCoverageVerification
      - name: Report achieved coverage
        run: bash scripts/coverage-summary.sh
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports
          if-no-files-found: warn

  - id: semgrep
    kind: security
    needs: [unit_tests]
    timeout_minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep==1.86.0
      - name: Semgrep SAST
        run: semgrep scan --config p/java --config p/secrets --error --metrics=off src

  - id: image_build_push
    kind: build_push
    needs: [semgrep]
    timeout_minutes: 45
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      CLAIR_VERSION: "4.7.4"
      CLAIRCTL_VERSION: "4.7.4"
      CLAIR_CONFIG_DIR: /tmp/clair
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build bootJar
        run: gradle --no-daemon bootJar -x test
      - name: Compute image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build image with Podman
        run: |
          podman build \
            --format docker \
            -t "localhost/app:${GITHUB_SHA::12}" \
            -f Containerfile .
      - name: Start local registry and push image for Clair indexing
        run: |
          podman run -d --name scan-registry --network host \
            docker.io/library/registry:2
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/ >/dev/null; then
              echo "registry ready"; break
            fi
            echo "waiting for registry ($i/30)"; sleep 2
          done
          curl -sf http://localhost:5000/v2/ >/dev/null
          podman tag "localhost/app:${GITHUB_SHA::12}" \
            "localhost:5000/app:${GITHUB_SHA::12}"
          podman push --tls-verify=false \
            "localhost:5000/app:${GITHUB_SHA::12}"
      - name: Start Clair and its datastore
        run: bash scripts/clair-up.sh
      - name: Install clairctl
        run: bash scripts/install-clairctl.sh
      - name: Clair container vulnerability scan
        run: bash scripts/clair-scan.sh "localhost:5000/app:${GITHUB_SHA::12}"
      - name: Upload Clair report
        uses: actions/upload-artifact@v4
        with:
          name: clair-scan-report
          path: reports/clair
          if-no-files-found: warn
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image to GHCR
        run: |
          REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          podman tag "localhost/app:${GITHUB_SHA::12}" "ghcr.io/${REPO_LC}:${GITHUB_SHA::12}"
          podman tag "localhost/app:${GITHUB_SHA::12}" "ghcr.io/${REPO_LC}:latest"
          podman push "ghcr.io/${REPO_LC}:${GITHUB_SHA::12}"
          podman push "ghcr.io/${REPO_LC}:latest"

  - id: provision
    kind: provision
    needs: [image_build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Terraform validate
        working-directory: infra
        run: terraform validate -no-color
      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -no-color -auto-approve tfplan

  - id: configure
    kind: configure
    needs: [provision, image_build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Read infrastructure outputs
        id: tf
        working-directory: infra
        run: |
          echo "host=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Wait for SSH availability
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
              "$SSH_USER@$HOST" true 2>/dev/null; then
              echo "SSH ready"; exit 0
            fi
            echo "waiting for ssh ($i/30)"; sleep 10
          done
          echo "SSH never became available"; exit 1
      - name: Render Chef node attributes
        working-directory: infra
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
          API_ADMIN_USERNAME: admin
          REG_USER: ${{ github.actor }}
          REG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.image_build_push.outputs.image_tag }}
          PROJECT: ${{ secrets.PROJECT_NAME }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ../chef/nodes
          DB_HOST="$(terraform output -raw db_address)" \
          DB_PORT="$(terraform output -raw db_port)" \
          DB_NAME="$(terraform output -raw db_name)" \
          DB_USER="$(terraform output -raw db_username)" \
          REPO_LC="$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" \
          python3 ../scripts/render-node-json.py > ../chef/nodes/app.json
          echo "Rendered node attributes ($(wc -c < ../chef/nodes/app.json) bytes)"
      - name: Upload Chef cookbook and run chef-solo
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          tar czf /tmp/chef-bundle.tgz -C chef .
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            /tmp/chef-bundle.tgz "$SSH_USER@$HOST:/tmp/chef-bundle.tgz"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$HOST" \
            'sudo bash -s' < scripts/run-chef.sh
      - name: Wait for application health through Nginx
        env:
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 15 \
            --retry-all-errors "http://$HOST/actuator/health"
          echo ""
          echo "Application is healthy at http://$HOST"

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Verify infrastructure resources exist
        working-directory: infra
        run: |
          terraform state list | grep -q aws_instance.app
          terraform state list | grep -q aws_db_instance.postgres
          terraform state list | grep -q aws_eip.app
          echo "Core infrastructure present in state"
      - name: Verify application through Nginx
        working-directory: infra
        env:
          ADMIN_SECRET: ${{ secrets.API_ADMIN_PASSWORD }}
        run: |
          HOST="$(terraform output -raw instance_public_ip)"
          curl --fail --silent --show-error --retry 15 --retry-delay 10 \
            --retry-all-errors "http://$HOST/actuator/health"
          echo ""
          curl --fail --silent --show-error "http://$HOST/api/v1/employees" \
            -H "Accept: application/json" -u "admin:$ADMIN_SECRET" -o /dev/null
          echo "Authenticated API call succeeded"
          echo "Application verified at http://$HOST"

pipelines:
  - id: infrastructure
    stages:
      - id: terraform_lifecycle
        kind: provision
        timeout_minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_wrapper: false
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Terraform format
            working-directory: infra
            run: terraform fmt -check -recursive
          - name: Terraform validate
            working-directory: infra
            run: terraform validate -no-color
          - name: Terraform plan
            working-directory: infra
            run: terraform plan -input=false -no-color -out=tfplan
          - name: Terraform apply
            working-directory: infra
            run: terraform apply -input=false -no-color -auto-approve tfplan
          - name: Verify infrastructure
            working-directory: infra
            run: |
              terraform state list
              echo "application URL: $(terraform output -raw application_url)"
              terraform output -raw db_address > /dev/null
              echo "Infrastructure verified"

  - id: validation
    stages:
      - id: smoke_and_integration
        kind: e2e
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "21"
          - name: Set up Gradle
            uses: gradle/actions/setup-gradle@v4
            with:
              gradle-version: "8.10.2"
          - name: Set up Node for Newman
            uses: actions/setup-node@v4
            with:
              node-version: "20"
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_wrapper: false
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Resolve target host
            id: tf
            working-directory: infra
            run: echo "host=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          - name: Smoke test
            env:
              HOST: ${{ steps.tf.outputs.host }}
            run: |
              curl --fail --silent --show-error --retry 10 --retry-delay 10 \
                --retry-all-errors "http://$HOST/actuator/health"
              echo ""
              echo "Smoke test passed"
          - name: REST Assured integration tests
            env:
              TARGET_BASE_URL: http://${{ steps.tf.outputs.host }}
              API_ADMIN_USERNAME: admin
              API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
            run: gradle --no-daemon integrationTest
          - name: Install Newman
            run: npm install --no-save newman newman-reporter-htmlextra
          - name: Newman functional tests
            env:
              BASE_URL: http://${{ steps.tf.outputs.host }}
              ADMIN_SECRET: ${{ secrets.API_ADMIN_PASSWORD }}
            run: |
              mkdir -p reports/newman
              npx newman run tests/postman/employee-api.postman_collection.json \
                --env-var "base_url=$BASE_URL" \
                --env-var "admin_user=admin" \
                --env-var "admin_password=$ADMIN_SECRET" \
                --reporters cli,htmlextra \
                --reporter-htmlextra-export reports/newman/report.html
          - name: Install k6
            run: |
              curl -sL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
                -o /tmp/k6.tgz
              tar xzf /tmp/k6.tgz -C /tmp
              sudo mv /tmp/k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6
              k6 version
          - name: k6 load test with p95 and error-rate thresholds
            env:
              BASE_URL: http://${{ steps.tf.outputs.host }}
              API_ADMIN_USERNAME: admin
              API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
            run: |
              mkdir -p reports/k6
              k6 run --summary-export reports/k6/summary.json tests/k6/load-test.js
          - name: Copy REST Assured HTML results into the report tree
            run: |
              mkdir -p reports/integrationTest
              cp -r build/reports/tests/integrationTest/. reports/integrationTest/ 2>/dev/null || \
                echo "No REST Assured HTML report produced"
          - name: Generate consolidated HTML report
            run: bash scripts/generate-report.sh
          - name: Publish test artifacts
            uses: actions/upload-artifact@v4
            with:
              name: validation-reports
              path: reports
              if-no-files-found: warn
