spring:
  datasource:
    url: jdbc:h2:mem:employees;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    # Migrations are PostgreSQL-specific DDL; the unit-test slice uses Hibernate's
    # generated schema on H2 instead. Migrations are exercised for real against RDS.
    enabled: false

app:
  security:
    admin-username: admin
    admin-password: test-admin-password

logging:
  level:
    root: WARN
